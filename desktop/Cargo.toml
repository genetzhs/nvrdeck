[package]
name = "nvrdeck"
version = "0.6.4"
edition = "2021"
description = "Lightweight NVR viewer for IP cameras"
license = "Apache-2.0"
repository = "https://github.com/genetzhs/nvrdeck"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
dirs = "5"
sha2 = "0.10"
getrandom = "0.2"
chrono = "0.4"
qrcode = { version = "0.14", default-features = false }
aes-gcm = "0.10"
pbkdf2 = "0.12"
base64 = "0.22"
serde_json = "1"
md5 = "0.7"
tract-onnx = "0.21"

[profile.release]
opt-level = 3

[package.metadata.deb]
name = "nvrdeck"
maintainer = "genetzhs <genetzhs@users.noreply.github.com>"
copyright = "2026, genetzhs"
license-file = ["../LICENSE", "0"]
extended-description = "Lightweight NVR viewer for IP cameras: live RTSP grid, NVR channel import, network scan."
depends = "$auto, ffmpeg"
section = "video"
priority = "optional"
assets = [
    ["target/release/nvrdeck", "usr/bin/", "755"],
    ["../packaging/nvrdeck.desktop", "usr/share/applications/", "644"],
    ["../packaging/nvrdeck.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]
